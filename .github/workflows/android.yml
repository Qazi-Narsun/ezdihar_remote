name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with a repository variable named GDRIVE_FOLDER_ID if the folder moves.
  GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1zd4qIyBgs1Yi6MzX-FQt8iQ9ODee0uqm' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so installing a newer build over an older one needs an uninstall first."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          name="ezdihar_remote_v${version}_build${{ github.run_number }}_${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Upload to Google Drive
        if: github.event_name != 'pull_request'
        # RCLONE_CONF is the rclone.conf made by `rclone config` with a Drive
        # remote named "gdrive" (see README). rclone refreshes the token itself.
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [[ -z "$RCLONE_CONF" ]]; then
            echo "::notice::Drive upload skipped: no RCLONE_CONF secret. The APK is still attached to this run as an artifact."
            exit 0
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy "dist/${{ steps.apk.outputs.name }}" gdrive: \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" --stats-one-line -v
          echo "Uploaded to [Google Drive](https://drive.google.com/drive/folders/$GDRIVE_FOLDER_ID)." >> "$GITHUB_STEP_SUMMARY"
